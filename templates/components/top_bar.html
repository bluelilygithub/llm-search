<!-- Top Bar -->
<div class="top-bar">
    <div class="top-bar-left">
        <div class="model-selector-container">
            <select class="model-selector" id="llm-model" onchange="updateModel()">
                <option value="">Loading models...</option>
            </select>
        </div>
        <button class="template-btn" onclick="window.app.openTemplatePicker()" title="Templates & Prompts">
            <i class="fas fa-file-alt"></i>
            <span>Templates</span>
        </button>
    </div>
    
    <div class="top-bar-right">
        <button class="top-bar-btn" onclick="toggleContextPanel()" title="Context Panel" id="context-toggle-btn">
            <i class="fas fa-layer-group"></i>
        </button>
        <button class="top-bar-btn" onclick="exportConversation()" title="Export to Markdown">
            <i class="fas fa-download"></i>
        </button>
        <button class="top-bar-btn" onclick="tagConversation()" title="Organize with Tags">
            <i class="fas fa-tags"></i>
        </button>
        <!-- Admin only: Reports & Analytics -->
        <button class="top-bar-btn" id="admin-reports-btn" onclick="window.app.openSettingsPanel()" title="Reports & Analytics" style="display:none;">
            <i class="fas fa-chart-bar"></i>
        </button>
        <!-- Account button for all users -->
        <button class="top-bar-btn" id="account-btn" onclick="window.openSettingsModal()" title="Account Settings" style="display:none;">
            <i class="fas fa-user-circle"></i>
        </button>
        <span id="username-display" style="display:none; margin-right: 10px; color: #666; font-size: 14px;"></span>
        <button class="top-bar-btn logout-btn" onclick="logout()" title="Logout" id="logout-btn" style="display:none;">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</div>
