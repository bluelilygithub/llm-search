<!-- Template Editor Modal -->
<div class="template-editor-modal" id="template-editor-modal" style="display: none;">
    <div class="template-editor-overlay" onclick="closeTemplateEditor()"></div>
    <div class="template-editor-content">
        <div class="template-editor-header">
            <h3 id="template-editor-title">
                <i class="fas fa-file-alt"></i>
                <span id="editor-title-text">New Template</span>
            </h3>
            <button class="template-editor-close" onclick="closeTemplateEditor()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="template-editor-body">
            <form id="template-editor-form">
                <input type="hidden" id="template-id" value="">
                
                <div class="form-group">
                    <label for="template-name">Template Name *</label>
                    <input type="text" id="template-name" placeholder="e.g., Email Template" required>
                </div>
                
                <div class="form-group">
                    <label for="template-category">Category *</label>
                    <select id="template-category" required>
                        <option value="">Select category</option>
                        <option value="writing">Writing</option>
                        <option value="code">Code</option>
                        <option value="research">Research</option>
                        <option value="creative">Creative</option>
                        <option value="business">Business</option>
                        <option value="education">Education</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="template-model">Default Model</label>
                    <select id="template-model">
                        <option value="">No default model</option>
                        <option value="gpt-4">GPT-4</option>
                        <option value="gpt-4-turbo">GPT-4 Turbo</option>
                        <option value="gpt-4o">GPT-4o</option>
                        <option value="claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                        <option value="claude-3-opus">Claude 3 Opus</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="template-icon">Icon</label>
                    <select id="template-icon">
                        <option value="fas fa-file-alt">📄 Document</option>
                        <option value="fas fa-envelope">✉️ Email</option>
                        <option value="fas fa-code">💻 Code</option>
                        <option value="fas fa-search">🔍 Research</option>
                        <option value="fas fa-lightbulb">💡 Creative</option>
                        <option value="fas fa-clipboard">📋 Meeting</option>
                        <option value="fas fa-blog">📝 Blog</option>
                        <option value="fas fa-chart-line">📊 Analysis</option>
                        <option value="fas fa-graduation-cap">🎓 Education</option>
                        <option value="fas fa-briefcase">💼 Business</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="template-description">Description</label>
                    <input type="text" id="template-description" placeholder="Brief description of what this template does">
                </div>
                
                <div class="form-group">
                    <label for="template-content">Template Content *</label>
                    <textarea id="template-content" rows="8" placeholder="Enter your template content. Use {{variable}} for placeholders..." required></textarea>
                    <small class="form-help">Use {{variable}} syntax for placeholders that users can fill in</small>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="template-public">
                        <span class="checkmark"></span>
                        Make this template public (visible to other users)
                    </label>
                </div>
            </form>
        </div>
        
        <div class="template-editor-footer">
            <button class="btn-secondary" onclick="closeTemplateEditor()">Cancel</button>
            <button class="btn-secondary" onclick="testTemplate()" id="test-template-btn">Test Template</button>
            <button class="btn-primary" onclick="saveTemplate()" id="save-template-btn">
                <i class="fas fa-save"></i>
                Save Template
            </button>
        </div>
    </div>
</div>

<!-- Template Test Modal -->
<div class="template-test-modal" id="template-test-modal" style="display: none;">
    <div class="template-test-overlay" onclick="closeTemplateTest()"></div>
    <div class="template-test-content">
        <div class="template-test-header">
            <h3><i class="fas fa-play"></i> Test Template</h3>
            <button class="template-test-close" onclick="closeTemplateTest()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="template-test-body">
            <div class="test-preview">
                <h4>Preview:</h4>
                <div id="template-preview" class="template-preview-content"></div>
            </div>
            
            <div class="test-actions">
                <button class="btn-primary" onclick="applyTestTemplate()">
                    <i class="fas fa-check"></i>
                    Use This Template
                </button>
                <button class="btn-secondary" onclick="closeTemplateTest()">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
