<!-- Settings Slide-Out Panel -->
<div class="settings-panel" id="settings-panel">
    <div class="settings-panel-overlay" onclick="closeSettingsPanel()"></div>
    <div class="settings-panel-content">
        <!-- Settings Header -->
        <div class="settings-header">
            <div class="settings-title">
                <i class="fas fa-cog"></i>
                <h2>Settings</h2>
            </div>
            <button class="settings-close-btn" onclick="closeSettingsPanel()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Settings Navigation -->
        <div class="settings-nav">
            <button class="settings-nav-btn" data-section="models" onclick="openModelManagement()">
                <i class="fas fa-robot"></i>
                Manage Models
            </button>
            <button class="settings-nav-btn active" data-section="account" onclick="showSettingsSection('account')">
                <i class="fas fa-user"></i>
                Profile
            </button>
            <button class="settings-nav-btn" data-section="templates" onclick="showSettingsSection('templates')">
                <i class="fas fa-file-alt"></i>
                Templates
            </button>
            <button class="settings-nav-btn" data-section="users" onclick="showSettingsSection('users')" id="users-nav-btn">
                <i class="fas fa-users"></i>
                Users
            </button>
        </div>

        <!-- Settings Content -->
        <div class="settings-content">
            <!-- Profile Section (formerly Account) -->
            <div class="settings-section active" id="account-section">
                <div class="section-header">
                    <h3>Profile Information</h3>
                    <p>View your profile details and session information.</p>
                </div>
                <div class="account-info" id="account-info-content">
                    <div class="loading-account">Loading profile information...</div>
                </div>
            </div>

            <!-- Templates Section -->
            <div class="settings-section" id="templates-section">
                <div class="section-header">
                    <h3>Template Management</h3>
                    <p>Create, edit, and organize your prompt templates.</p>
                </div>

                <div class="templates-container">
                    <div class="templates-header">
                        <div class="templates-actions">
                            <button class="btn-primary" onclick="openTemplateEditor()">
                                <i class="fas fa-plus"></i>
                                New Template
                            </button>
                            <button class="btn-secondary" onclick="refreshTemplatesList()">
                                <i class="fas fa-sync"></i>
                                Refresh
                            </button>
                        </div>
                    </div>

                    <div class="templates-list" id="templates-list">
                        <div class="loading-templates">Loading templates...</div>
                    </div>
                </div>
            </div>

            <!-- User Management Section (Admin Only) -->
            <div class="settings-section" id="users-section">
                <div class="section-header">
                    <h3>User Management</h3>
                    <p>Create and manage user accounts for your team.</p>
                </div>

                <div class="users-container">
                    <div class="users-header">
                        <div class="users-actions">
                            <button class="btn-primary" onclick="openCreateUserModal()">
                                <i class="fas fa-user-plus"></i>
                                Create New User
                            </button>
                            <button class="btn-secondary" onclick="refreshUsersList()">
                                <i class="fas fa-sync"></i>
                                Refresh
                            </button>
                        </div>
                    </div>

                    <div class="users-list" id="users-list">
                        <div class="loading-users">Loading users...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
