<!-- Account Panel - Simplified for Regular Users -->
<div class="account-panel" id="account-panel">
    <div class="account-panel-overlay" onclick="closeAccountPanel()"></div>
    <div class="account-panel-content">
        <!-- Account Header -->
        <div class="account-header">
            <div class="account-title">
                <i class="fas fa-user-circle"></i>
                <h2>My Account</h2>
            </div>
            <button class="account-close-btn" onclick="closeAccountPanel()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Account Content -->
        <div class="account-content-wrapper">
            <div class="account-info-card" id="account-panel-info">
                <div class="loading-account">Loading account information...</div>
            </div>
            
            <!-- Update Profile Form -->
            <div class="account-update-form" id="account-update-form" style="display: none;">
                <h4><i class="fas fa-edit"></i> Update Profile</h4>
                
                <div class="form-group">
                    <label for="update-display-name">Display Name</label>
                    <input type="text" id="update-display-name" class="form-control" placeholder="Enter display name">
                </div>
                
                <div class="form-group">
                    <label for="update-current-password">Current Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="update-current-password" class="form-control" placeholder="Enter current password">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('update-current-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="update-new-password">New Password (optional)</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="update-new-password" class="form-control" placeholder="Leave blank to keep current">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('update-new-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small class="form-hint">
                        <strong>Password must contain:</strong><br>
                        • At least 8 characters<br>
                        • One uppercase letter<br>
                        • One lowercase letter<br>
                        • One number<br>
                        • One special character (!@#$%^&* etc.)
                    </small>
                </div>
                
                <div class="form-group">
                    <label for="update-confirm-password">Confirm New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="update-confirm-password" class="form-control" placeholder="Confirm new password">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('update-confirm-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button class="btn-primary" onclick="updateUserProfile()">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
                
                <div class="update-message" id="update-message" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>
