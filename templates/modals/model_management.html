<!-- Model Management Modal -->
<div class="modal model-management-modal" id="model-management-modal" style="display: none;" tabindex="0" role="dialog" aria-labelledby="model-management-title" aria-hidden="true">
    <div class="modal-content" tabindex="0">
        <!-- Header -->
        <div class="modal-header">
            <h2 id="model-management-title">Model Management</h2>
            <button class="modal-close-btn" onclick="closeModelManagement()" aria-label="Close modal">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="modal-body">
            <!-- API Key Status -->
            <div class="section">
                <h3>Railway API Key Status</h3>
                <div id="api-keys-status" class="api-keys-simple">
                    <div class="loading">Loading API key status...</div>
                </div>
            </div>

            <!-- Add New Model -->
            <div class="section">
                <h3>Add New Model</h3>
                <div class="add-model-form-grid">
                    <div class="form-row">
                        <label for="model-name">Display Name:</label>
                        <input type="text" id="model-name" placeholder="e.g., Gemini Pro 1.5" />
                        <small style="grid-column: 2; color: #666; font-size: 12px; margin-top: -10px;">Human-readable label shown in dropdowns</small>
                    </div>
                    <div class="form-row">
                        <label for="model-value">Model Identifier:</label>
                        <input type="text" id="model-value" placeholder="e.g., gemini-1.5-pro" />
                        <small style="grid-column: 2; color: #666; font-size: 12px; margin-top: -10px;">Actual API model name (required)</small>
                    </div>
                    <div class="form-row">
                        <label for="model-provider">Provider:</label>
                        <select id="model-provider">
                            <option value="">Select provider...</option>
                            <option value="OpenAI">OpenAI</option>
                            <option value="Anthropic">Anthropic</option>
                            <option value="Google">Google</option>
                            <option value="Hugging Face">Hugging Face</option>
                            <option value="Stability AI">Stability AI</option>
                            <option value="Custom">Custom</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="model-api-key">API Key Name:</label>
                        <select id="model-api-key">
                            <option value="">Auto-detect from provider</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="model-description">Description:</label>
                        <input type="text" id="model-description" placeholder="Brief description" />
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" onclick="testModelAccess()" id="test-model-btn">
                            <i class="fas fa-flask"></i> Test Access
                        </button>
                        <button class="btn btn-primary" onclick="addModel()" id="add-model-btn">
                            <i class="fas fa-plus"></i> Add Model
                        </button>
                    </div>
                </div>
            </div>

            <!-- Current Models -->
            <div class="section">
                <h3>Current Models</h3>
                <div id="current-models-list" class="models-simple-table">
                    <div class="loading">Loading models...</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModelManagement()">
                <i class="fas fa-times"></i> Close
            </button>
            <button class="btn btn-warning" onclick="window.testAllModels()" id="test-all-models-btn">
                <i class="fas fa-flask"></i> Test All Models
            </button>
            <button class="btn btn-primary" onclick="saveModelSettings()" id="save-model-settings-btn">
                <i class="fas fa-save"></i> Save Settings
            </button>
            <button class="btn btn-info" onclick="refreshModelManagement()">
                <i class="fas fa-refresh"></i> Refresh All
            </button>
        </div>
    </div>
</div>

<style>
/* Model Management Modal Styles */
.model-management-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    outline: none;
    pointer-events: auto; /* Ensure modal can receive events */
}

.model-management-modal:focus {
    outline: none;
}

.model-management-modal .modal-content {
    background: white;
    border-radius: 8px;
    width: 90%;
    max-width: 800px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    outline: none;
    pointer-events: auto; /* Ensure content can receive events */
    z-index: 1001; /* Higher than modal background */
    position: relative; /* Create stacking context */
}

.model-management-modal .modal-header {
    padding: 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.model-management-modal .modal-body {
    padding: 20px;
}

.model-management-modal .modal-footer {
    padding: 20px;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.model-management-modal .section {
    margin-bottom: 30px;
}

.model-management-modal .section h3 {
    margin-bottom: 15px;
    color: #333;
    font-size: 18px;
}

/* API Keys Simple Display */
.api-keys-simple {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.api-key-simple {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #f8f9fa;
    border-radius: 5px;
    border-left: 4px solid #ddd;
}

.api-key-simple.configured {
    border-left-color: #28a745;
    background: #d4edda;
}

.api-key-simple.not-configured {
    border-left-color: #dc3545;
    background: #f8d7da;
}

.api-key-info {
    display: flex;
    align-items: center;
    gap: 8px;
}

.api-key-name {
    font-weight: bold;
    color: #333;
    font-family: 'Courier New', monospace;
}

.api-key-provider {
    color: #666;
    font-size: 14px;
}

.api-key-status {
    font-size: 14px;
    font-weight: bold;
}

/* Add Model Form Grid */
.add-model-form-grid {
    display: grid;
    gap: 15px;
}

.add-model-form-grid .form-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    align-items: center;
    gap: 10px;
}

.add-model-form-grid label {
    font-weight: bold;
    color: #333;
}

.add-model-form-grid input,
.add-model-form-grid select {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
}

.add-model-form-grid .form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 10px;
}

/* Simple Models Table */
.models-simple-table {
    border: 1px solid #ddd;
    border-radius: 5px;
    overflow: hidden;
}

.model-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1.5fr 1fr 1fr 80px;
    align-items: center;
    padding: 12px 15px;
    border-bottom: 1px solid #eee;
    background: white;
}

.model-row:hover {
    background: #f8f9fa;
}

.model-row.header {
    background: #f1f3f4;
    font-weight: bold;
    color: #333;
}

.model-enabled {
    display: flex;
    align-items: center;
    gap: 8px;
}

.model-enabled.enabled {
    color: #28a745;
}

.model-enabled.disabled {
    color: #dc3545;
}

.model-actions {
    display: flex;
    gap: 5px;
}

.btn-small {
    padding: 4px 8px;
    font-size: 12px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
}

.btn-tiny {
    padding: 2px 4px;
    font-size: 10px;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    background: #6c757d;
    color: white;
}

.btn-tiny:hover {
    background: #5a6268;
}

.btn-migrate {
    background: #17a2b8;
    color: white;
    margin-left: 8px;
}

.btn-migrate:hover {
    background: #138496;
}

.btn-small.btn-secondary {
    background: #6c757d;
    color: white;
}

.btn-small.btn-danger {
    background: #dc3545;
    color: white;
}

.status-available { color: #28a745; font-weight: bold; }
.status-error { color: #dc3545; font-weight: bold; }
.status-unknown { color: #6c757d; }
.status-testing { color: #007bff; }

.loading, .error, .no-models {
    text-align: center;
    padding: 20px;
    color: #6c757d;
    font-style: italic;
}

/* Toggle Switch Styles */
.toggle-switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 24px;
}

.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 24px;
}

.toggle-slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
}

.toggle-switch input:checked + .toggle-slider {
    background-color: #4CAF50;
}

.toggle-switch input:focus + .toggle-slider {
    box-shadow: 0 0 1px #4CAF50;
}

.toggle-switch input:checked + .toggle-slider:before {
    transform: translateX(26px);
}

/* Radio Button Styles */
.radio-container {
    position: relative;
    display: inline-block;
    cursor: pointer;
    padding-left: 25px;
    margin-bottom: 12px;
    font-size: 14px;
    user-select: none;
}

.radio-container input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
}

.radio-checkmark {
    position: absolute;
    top: 0;
    left: 0;
    height: 20px;
    width: 20px;
    background-color: #eee;
    border-radius: 50%;
    transition: background-color 0.3s;
}

.radio-container:hover input ~ .radio-checkmark {
    background-color: #ccc;
}

.radio-container input:checked ~ .radio-checkmark {
    background-color: #2196F3;
}

.radio-container input:disabled ~ .radio-checkmark {
    background-color: #ddd;
    cursor: not-allowed;
}

.radio-container input:disabled {
    cursor: not-allowed;
}

.radio-checkmark:after {
    content: "";
    position: absolute;
    display: none;
}

.radio-container input:checked ~ .radio-checkmark:after {
    display: block;
}

.radio-container .radio-checkmark:after {
    top: 6px;
    left: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
}

/* Status colors */
.status-success { color: #28a745; font-weight: bold; }
</style>
