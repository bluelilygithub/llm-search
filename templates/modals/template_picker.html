<!-- Template Picker Modal -->
<div class="template-modal" id="template-modal" style="display: none;">
    <div class="template-modal-content">
        <div class="template-modal-header">
            <h3><i class="fas fa-file-alt"></i> Choose Template</h3>
            <button class="template-modal-close" onclick="window.app.closeTemplatePicker()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="template-modal-body">
            <div class="template-search">
                <div class="template-search-input">
                    <i class="fas fa-search"></i>
                    <input type="text" id="template-search" placeholder="Search templates..." oninput="window.app.searchTemplates(this.value)">
                </div>
            </div>
            
            <div class="template-categories">
                <div class="template-category-tabs">
                    <button class="category-tab active" onclick="window.app.filterTemplates('all')" data-category="all">All</button>
                    <button class="category-tab" onclick="window.app.filterTemplates('writing')" data-category="writing">Writing</button>
                    <button class="category-tab" onclick="window.app.filterTemplates('research')" data-category="research">Research</button>
                    <button class="category-tab" onclick="window.app.filterTemplates('code')" data-category="code">Code</button>
                    <button class="category-tab" onclick="window.app.filterTemplates('creative')" data-category="creative">Creative</button>
                </div>
            </div>
            
            <div class="template-grid" id="template-grid">
                <!-- Templates will be populated dynamically by JavaScript -->
                <div class="template-loading" id="template-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Loading templates...</span>
                </div>
            </div>
        </div>
        
        <div class="template-modal-footer">
            <button class="template-btn-secondary" onclick="window.app.closeTemplatePicker()">Cancel</button>
            <button class="template-btn-primary" onclick="window.app.createCustomTemplate()">
                <i class="fas fa-plus"></i> Create Custom Template
            </button>
        </div>
    </div>
</div>
