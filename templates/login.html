<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Knowledge Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 480px;
            max-width: 90vw;
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: block;
        }
        
        .login-header h1 {
            color: #2d3748;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .login-header p {
            color: #718096;
            font-size: 16px;
            margin-bottom: 32px;
            font-weight: 400;
        }
        
        
        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }
        
        .password-container {
            position: relative;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 16px 50px 16px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }
        
        input[type="password"]:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
            background: white;
        }
        
        input[type="password"]::placeholder {
            color: #a0aec0;
            font-weight: 400;
        }
        
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }
        
        .password-toggle:hover {
            color: #4a5568;
        }
        
        .login-btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .login-btn.primary {
            background: #d69e2e;
            color: white;
        }
        
        .login-btn.primary:hover {
            background: #b7791f;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(214, 158, 46, 0.3);
        }
        
        .login-btn.secondary {
            background: #38a169;
            color: white;
        }
        
        .login-btn.secondary:hover {
            background: #2f855a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
        }
        
        .login-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #a0aec0;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e2e8f0;
            z-index: 1;
        }
        
        .divider span {
            background: white;
            padding: 0 16px;
            position: relative;
            z-index: 2;
        }
        
        .footer-links {
            margin-top: 32px;
            text-align: center;
        }
        
        .footer-link {
            color: #d69e2e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
            transition: color 0.2s;
        }
        
        .footer-link:hover {
            color: #b7791f;
            text-decoration: underline;
        }
        
        .signup-text {
            color: #718096;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
            font-size: 14px;
            text-align: left;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #666;
            margin-top: 16px;
            font-size: 14px;
        }
        
        .loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Forgot Password Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            margin-bottom: 24px;
        }
        
        .modal-header h2 {
            color: #2d3748;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .modal-header p {
            color: #718096;
            font-size: 14px;
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            color: #a0aec0;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .modal-close:hover {
            color: #2d3748;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
            margin-bottom: 16px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
            background: white;
        }
        
        .login-hint {
            font-size: 12px;
            color: #666;
            margin-bottom: 16px;
            padding: 12px;
            background: #f7fafc;
            border-radius: 6px;
            border-left: 3px solid #3182ce;
        }
        
        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
        }
        
        .reset-code-display {
            background: #fef5e7;
            border: 2px dashed #d69e2e;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        
        .reset-code {
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: 700;
            color: #b7791f;
            letter-spacing: 4px;
            user-select: all;
            padding: 10px;
            background: white;
            border-radius: 6px;
            margin: 10px 0;
        }
        
        .code-hint {
            color: #975a16;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="static/images/logo.png" alt="AI Knowledge Base" class="logo">
        
        <div class="login-header">
            <h1>AI Knowledge Base</h1>
            <p>Please enter your password to continue</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" name="username" class="form-input" placeholder="Username (optional for admin)" autocomplete="username">
            </div>
            
            <div class="form-group">
                <div class="password-container">
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fas fa-eye password-toggle" id="passwordToggle" onclick="togglePassword()"></i>
                </div>
            </div>
            
            <div class="login-hint">
                <strong>Admin:</strong> Leave username blank, enter password<br>
                <strong>Users:</strong> Enter both username and password
            </div>
            
            <button type="submit" class="login-btn primary" id="loginBtn">
                <i class="fas fa-lock"></i>
                Sign In
            </button>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading">
                <i class="fas fa-spinner"></i> Signing in...
            </div>
        </form>
        
        <div class="footer-links">
            <div class="signup-text" style="font-size: 13px; color: #666;">
                Need an account? Contact your administrator
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('passwordToggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');
            
            // Reset UI
            errorMessage.style.display = 'none';
            loginBtn.disabled = true;
            loading.style.display = 'block';
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Show success message briefly
                    if (data.user_type === 'admin') {
                        loading.innerHTML = '<i class="fas fa-check-circle"></i> Admin login successful!';
                    } else {
                        loading.innerHTML = '<i class="fas fa-check-circle"></i> Welcome, ' + (data.display_name || data.username) + '!';
                    }
                    
                    // Redirect to main app after brief delay
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    errorMessage.textContent = data.error || 'Invalid credentials';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                if (!errorMessage.style.display || errorMessage.style.display === 'none') {
                    // Keep loading visible for success message
                } else {
                    loading.style.display = 'none';
                }
            }
        });
        
        // Focus username field on load
        document.getElementById('username').focus();
    </script>
</body>
</html>
